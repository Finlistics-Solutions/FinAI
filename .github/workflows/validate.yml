name: validate

# The public catalog mirrors this repository after pushes. Require this job on
# every protected publication branch to reject invalid changes before merge.
# It runs the same hooks as the local pre-commit install.
on:
  push:
    branches: ["**"]
  pull_request:

# Least privilege: nothing here needs to write to the repo.
permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Actions are pinned to immutable commit SHAs. A tag like @v4 can be
      # repointed by its owner at any time.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.14"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.2"

      - name: Install Claude Code
        run: npm install --global --no-audit --no-fund @anthropic-ai/claude-code@2.1.274

      # Keep this explicit instead of pre-commit/action: that composite action
      # installs an unpinned pre-commit release and references actions/cache@v4.
      - name: Install pre-commit
        run: python -m pip install --disable-pip-version-check --no-cache-dir pre-commit==4.6.2

      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure --color=always
