name: validate

# Once the plugin is published, pushes to this repo are mirrored into the
# public catalog automatically, so a broken manifest ships without review.
# This runs the same hooks as the local pre-commit install.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - uses: pre-commit/action@v3.0.1
